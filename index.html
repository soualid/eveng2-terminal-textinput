<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151b23">
<script>
  // theme before first paint (no flash); falls back to the OS light/dark preference
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') } catch {}
</script>
<title>Even Terminal — text input</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d1117'/><path d='M17 20l16 12-16 12' stroke='%234bb7c3' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' fill='none'/><rect x='37' y='39' width='14' height='7' rx='3.5' fill='%233fb950'/></svg>">
<style>
  /* ---- themes: every color is a token, [data-theme] on <html> swaps the set ---- */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117; --surface: #151b23; --surface-2: #1d242e; --border: #29313c;
    --fg: #e6edf3; --dim: #8b949e; --accent: #4bb7c3; --accent-fg: #03262b;
    --user: #173b43; --user-fg: #e6f6f8;
    --green: #3fb950; --red: #f85149; --amber: #d29922;
    --code-bg: rgba(110, 118, 129, .22); --shadow: rgba(0, 0, 0, .4);
    --accent-grad: var(--accent); --art: none;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --border: #dadee4;
    --fg: #1c2128; --dim: #5d6876; --accent: #0b7f8a; --accent-fg: #ffffff;
    --user: #d8eef0; --user-fg: #0f2e33;
    --green: #1a7f37; --red: #cf222e; --amber: #9a6700;
    --code-bg: rgba(27, 31, 36, .07); --shadow: rgba(23, 32, 48, .12);
    --accent-grad: var(--accent); --art: none;
  }
  [data-theme="night"] {
    color-scheme: dark;
    --bg: #0a0f1f; --surface: #10172c; --surface-2: #172040; --border: #222d52;
    --fg: #d8e1fb; --dim: #7f8bb2; --accent: #7aa2f7; --accent-fg: #0a0f1f;
    --user: #1c2a57; --user-fg: #e3e9ff;
    --green: #9ece6a; --red: #f7768e; --amber: #e0af68;
    --code-bg: rgba(122, 162, 247, .13); --shadow: rgba(2, 5, 16, .55);
    --accent-grad: var(--accent); --art: none;
  }
  [data-theme="solarized"] {
    color-scheme: light;
    --bg: #fdf6e3; --surface: #fffbef; --surface-2: #eee8d5; --border: #e2dbc4;
    --fg: #45585e; --dim: #6c7c7f; --accent: #268bd2; --accent-fg: #fdf6e3;
    --user: #e2ebdb; --user-fg: #2f4a44;
    --green: #859900; --red: #dc322f; --amber: #b58900;
    --code-bg: rgba(147, 161, 161, .2); --shadow: rgba(88, 110, 117, .16);
    --accent-grad: var(--accent); --art: none;
  }
  [data-theme="mermaid"] {
    color-scheme: light;
    --bg: #fff0f7; --surface: #fff8fc; --surface-2: #ffe0ef; --border: #f6c4dc;
    --fg: #3d0a24; --dim: #94456b; --accent: #e0218a; --accent-fg: #ffffff;
    --user: linear-gradient(135deg, #e0218a, #b5126f); --user-fg: #ffffff;
    --green: #1f9d55; --red: #d61f45; --amber: #b7791f;
    --code-bg: rgba(224, 33, 138, .09); --shadow: rgba(160, 20, 90, .16);
    --accent-grad: linear-gradient(135deg, #ff69b4, #e0218a 55%, #b5126f);
    --art: radial-gradient(900px 520px at 110% -10%, rgba(255, 105, 180, .18), transparent 60%),
           radial-gradient(800px 480px at -15% 110%, rgba(200, 140, 255, .12), transparent 60%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  html, body { height: 100%; }
  body {
    background: var(--art), var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- header ---- */
  header {
    padding: calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .htext { flex: 1; min-width: 0; padding: 0 6px; }
  header .title { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; min-width: 0; }
  header .sub .proj { color: var(--accent); font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hmeta select {
    appearance: none; -webkit-appearance: none; max-width: 100%; cursor: pointer; field-sizing: content;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    color: var(--fg); font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; padding: 3px 9px;
  }

  /* ---- buttons ---- */
  button {
    background: var(--surface-2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-family: inherit; font-size: 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s, border-color .15s, color .15s, transform .1s;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent-grad); border-color: transparent; color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.icon { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; flex-shrink: 0;
    background: none; border-color: transparent; color: var(--dim); }
  button.icon.primary { background: var(--accent-grad); color: var(--accent-fg); }
  #scrollBtn.on { color: var(--accent); }
  @media (hover: hover) {
    button:not(.icon):not(.primary):hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    button.icon:not(.primary):hover { background: var(--surface-2); color: var(--fg); }
    button.primary:hover { filter: brightness(1.08); }
  }

  .chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
    font-variant-numeric: tabular-nums; color: var(--dim); background: color-mix(in srgb, var(--dim) 15%, transparent); }
  .chip.busy { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .chip.idle { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .chip.waiting { color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .chip.stale { color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }
  /* live activity age on busy rows */
  #sessionList .w.fresh { color: var(--green); }
  #sessionList .w.quiet { color: var(--amber); }
  #sessionList .w.stale { color: var(--red); }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---- global bar ---- */
  .gbar {
    display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch;
  }
  .gpill {
    display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface); color: var(--dim);
  }
  .gpill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .gpill.busy { color: var(--fg); border-color: color-mix(in srgb, var(--amber) 60%, var(--border)); }
  .gpill.busy .dot { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  .gpill .n {
    font-size: 11px; font-weight: 700; color: var(--bg); background: var(--amber);
    border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center;
  }
  .gpill.active { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 13%, var(--surface)); }
  /* at least one busy session hasn't written anything for a while */
  .gpill.stale .dot { background: var(--red); }
  .gpill.stale .n { background: var(--red); color: #fff; }

  /* ---- session list ---- */
  #sessionList .proj { color: var(--accent); font-weight: 500; }
  #sessionList .pre {
    color: var(--amber); font-size: 12px; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sessionList .row {
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background-color .15s;
  }
  @media (hover: hover) { #sessionList .row:hover { background: var(--surface); } }
  #sessionList .row:active { background: var(--surface-2); }
  #sessionList .row.muted { opacity: .5; }
  .kebab {
    flex-shrink: 0; border: none; background: none; color: var(--dim);
    padding: 4px 8px; font-size: 18px; line-height: 1;
  }
  .unarch { flex-shrink: 0; font-size: 12px; padding: 6px 10px; color: var(--accent); }
  .menu {
    position: fixed; z-index: 50; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 6px;
    display: flex; flex-direction: column; min-width: 210px; max-height: calc(100dvh - 90px); overflow-y: auto;
    box-shadow: 0 14px 36px var(--shadow); transform-origin: top right; animation: pop .14s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
  .menu button {
    display: flex; align-items: center; gap: 10px; text-align: left; border: none; background: none;
    color: var(--fg); padding: 9px 10px; border-radius: 8px; font-size: 14px;
  }
  .menu button:active, .menu button:hover { background: var(--surface-2); }
  .menu button.on::after { content: '✓'; margin-left: auto; color: var(--accent); font-weight: 700; }
  .menu hr { border: none; border-top: 1px solid var(--border); margin: 5px 4px; }
  .menu .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); padding: 6px 10px 3px; }
  .sw { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px var(--border); }
  .footer {
    padding: 14px; text-align: center; color: var(--accent);
    font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .footer:active { background: var(--surface); }
  #sessionList .meta { flex: 1; min-width: 0; }
  #sessionList .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sessionList .d { color: var(--dim); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }

  /* ---- transcript ---- */
  #transcript { padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { border-radius: 18px; padding: 10px 14px; max-width: min(92%, 820px);
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .bubble.user { background: var(--user); color: var(--user-fg); align-self: flex-end; border-bottom-right-radius: 6px; }
  .bubble.assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; }
  .bubble.dim { opacity: .55; }
  /* latest prompt, always in view right under the session title; tap to expand */
  #promptBar {
    position: relative; z-index: 1; flex-shrink: 0; display: flex; gap: 10px; cursor: pointer;
    padding: 8px 16px 9px; background: var(--surface); border-bottom: 1px solid var(--border);
    box-shadow: 0 10px 18px -12px var(--shadow); font-size: 13.5px; line-height: 1.45;
  }
  #promptBar::before { content: ''; width: 3px; border-radius: 3px; flex-shrink: 0; background: var(--accent-grad); }
  #promptBar span { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  #promptBar.open span { display: block; max-height: 40vh; overflow-y: auto; }

  /* ---- markdown (assistant bubbles) ---- */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 7px 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4, .bubble.md h5, .bubble.md h6 {
    margin: 14px 0 6px; line-height: 1.3; font-size: 1em; letter-spacing: -.01em; }
  .bubble.md h1 { font-size: 1.3em; }
  .bubble.md h2 { font-size: 1.17em; }
  .bubble.md h3 { font-size: 1.06em; }
  .bubble.md ul, .bubble.md ol { margin: 7px 0; padding-left: 22px; }
  .bubble.md li { margin: 3px 0; }
  .bubble.md li::marker { color: var(--dim); }
  .bubble.md code { background: var(--code-bg); border-radius: 5px; padding: 1px 5px;
                    font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bubble.md pre { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
                   padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
  .bubble.md pre code { background: none; padding: 0; font-size: 12px; line-height: 1.5; white-space: pre; }
  .bubble.md blockquote { border-left: 3px solid color-mix(in srgb, var(--accent) 55%, var(--border));
    margin: 8px 0; padding: 2px 12px; color: var(--dim); }
  .bubble.md a { color: var(--accent); text-underline-offset: 2px; }
  .bubble.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .bubble.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px;
                     display: block; overflow-x: auto; max-width: 100%; }
  .bubble.md th, .bubble.md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bubble.md th { background: var(--surface-2); font-weight: 600; }
  .bubble.md > :first-child { margin-top: 0; }
  .bubble.md > :last-child { margin-bottom: 0; }
  .mermaid-box.rendered { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
                          padding: 10px; margin: 8px 0; overflow-x: auto; text-align: center; }
  .mermaid-box svg { max-width: 100%; height: auto; }
  .line { color: var(--dim); font-size: 12.5px; padding: 0 4px; word-break: break-word; }
  .line.err { color: var(--red); }
  .line.thinking { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tool { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
          background: var(--surface); border: 1px solid var(--border);
          border-radius: 10px; padding: 6px 10px; align-self: flex-start; max-width: 92%; cursor: pointer; }
  .tool .spin::after { content: "…"; }
  .tool pre { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--bg); font-size: 11px; color: var(--fg);
              overflow-x: auto; max-height: 200px; overflow-y: auto; display: none; }
  .tool.open pre { display: block; }
  .card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
          border-radius: 16px; padding: 14px; box-shadow: 0 6px 20px var(--shadow); }
  .card h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; color: var(--accent); }
  .card p { font-size: 13.5px; margin-bottom: 12px; white-space: pre-wrap; }
  .card .opts { display: flex; flex-direction: column; gap: 8px; }
  .card .opts button { text-align: left; }
  .card .opts button small { display: block; color: var(--dim); font-weight: 400; }
  .card .opts button.primary small { color: inherit; opacity: .8; }
  .card.done { border-color: var(--border); box-shadow: none; opacity: .6; }
  .result { font-size: 11.5px; color: var(--dim); text-align: center; padding: 2px 0 10px; font-variant-numeric: tabular-nums; }
  /* per-line timestamp, rendered from data-when so streaming innerHTML
     rewrites can't wipe it */
  [data-when]::after { content: attr(data-when); color: var(--dim); font-size: 10px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .bubble[data-when]::after, .card[data-when]::after { display: block; text-align: right; margin: 3px 0 0; opacity: .75; }
  .bubble.user[data-when]::after { color: inherit; opacity: .6; }

  /* ---- composer ---- */
  #composer {
    display: none; gap: 8px; align-items: flex-end; flex-shrink: 0;
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--surface); border-top: 1px solid var(--border);
  }
  #composer textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 21px; padding: 10px 16px;
    font: inherit; line-height: 1.4; max-height: 130px; min-height: 42px;
    transition: border-color .15s, box-shadow .15s;
  }
  #composer textarea::placeholder { color: var(--dim); }
  #composer textarea:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  #attachBtn, #sendBtn { width: 42px; height: 42px; border-radius: 50%; }
  #attachments {
    display: none; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
    padding: 10px 12px 0; background: var(--surface);
  }
  .att { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .att img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .att.file {
    width: auto; max-width: 150px; display: flex; align-items: center; gap: 6px;
    padding: 0 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); font-size: 12px;
  }
  .att.file .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att.up { opacity: .5; }
  .att.err img { border-color: var(--red); }
  .att.err.file { border-color: var(--red); }
  .att .x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    padding: 0; border-radius: 50%; font-size: 11px; line-height: 1;
    background: var(--surface); border: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <button id="backBtn" class="icon" style="display:none" title="Back to the list" aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="htext">
    <div class="title" id="hTitle">Even Terminal — text input</div>
    <div class="hmeta">
      <span class="sub" id="hSub" style="display:none"></span>
      <select id="instSel"><option>connecting…</option></select>
      <select id="modelSel" style="display:none" title="Model for the next message">
        <option value="">🧠 Opus 4.6 · default ▾</option>
        <option value="claude-fable-5-1">🧠 Fable 5.1 ▾</option>
        <option value="claude-fable-5">🧠 Fable 5 ▾</option>
        <option value="claude-opus-5-5">🧠 Opus 5.5 ▾</option>
        <option value="claude-opus-5">🧠 Opus 5 ▾</option>
        <option value="claude-sonnet-5">🧠 Sonnet 5 ▾</option>
        <option value="claude-haiku-4-5-20251001">🧠 Haiku 4.5 ▾</option>
      </select>
      <select id="effortSel" style="display:none" title="Reasoning effort for the next message">
        <option value="">💭 effort · default ▾</option>
        <option value="low">💭 effort · low ▾</option>
        <option value="medium">💭 effort · medium ▾</option>
        <option value="high">💭 effort · high ▾</option>
        <option value="xhigh">💭 effort · xhigh ▾</option>
        <option value="max">💭 effort · max ▾</option>
      </select>
    </div>
  </div>
  <span class="chip" id="statusChip" style="display:none" title="busy · elapsed · ↑output tokens so far — ⚠ silent = no events from even-terminal">idle</span>
  <button id="scrollBtn" class="icon" style="display:none" title="Follow new messages (tap to jump to the bottom)" aria-label="Follow"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
  <button id="stopBtn" class="icon" style="display:none" title="Interrupt Claude" aria-label="Stop"><svg class="ico" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none"/></svg></button>
  <button id="newBtn" class="icon primary" title="New session" aria-label="New session"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="moreBtn" class="icon" title="More — actions and theme" aria-label="More"><svg class="ico" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
</header>
<div id="promptBar" style="display:none" title="Last prompt — tap to expand"><span></span></div>

<main id="main">
  <div id="sessionList"></div>
  <div id="transcript" style="display:none"></div>
</main>

<div id="attachments"></div>
<div id="composer">
  <input id="fileInput" type="file" accept="image/*,.zip,application/zip,application/x-zip-compressed" multiple hidden>
  <button id="attachBtn" class="icon" title="Attach a screenshot or zip" aria-label="Attach"><svg class="ico" viewBox="0 0 24 24"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
  <textarea id="input" rows="1" placeholder="Message Claude… (Ctrl+Enter to send)"></textarea>
  <button id="sendBtn" class="icon primary" title="Send (Ctrl+Enter)" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>

<script>
'use strict'
const $ = (id) => document.getElementById(id)
// Every /api/* call is stamped with the selected even-terminal instance
const withInst = (path) => {
  const i = currentInst()
  if (!i || !path.startsWith('/api/')) return path
  return path + (path.includes('?') ? '&' : '?') + '_inst=' + i.port
}
const api = (path, opts) => fetch(withInst(path), opts).then(async (r) => {
  const body = await r.json().catch(() => ({}))
  if (!r.ok && !(r.status === 202)) throw new Error(body.error || r.status)
  return body
})
const post = (path, body) => api(path, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body),
})

let instances = []           // live even-terminal instances
// scope drives the list: 'all' aggregates every instance, or a port number
// filters to one. Sessions are always fetched from all instances so the
// global bar reflects everything regardless of the current filter.
let scope = localStorage.getItem('scope') || 'all'
// Model for prompts, applied session-wide by even-terminal on the next
// message ('' = even-terminal's built-in default). Persisted per device.
let model = localStorage.getItem('model') || ''
// Reasoning effort, same lifecycle as model ('' = model's default).
let effort = localStorage.getItem('effort') || ''
let allSessions = []         // aggregated sessions, each tagged with _port/_proj
let curPort = null           // port of the open session (or new-session target)
let pollTimer = null

// User overrides for even-terminal's last-line busy heuristic, which can
// misreport a stalled/interrupted session as busy.
// done: id -> timestamp at which the user marked it done. Keyed by timestamp
// so the override auto-expires if the session genuinely advances again.
let doneMap = JSON.parse(localStorage.getItem('done') || '{}')
// Archived conversations: id -> { title, proj, ts } snapshot, so the Archives
// view can render them even once they drop out of the recent-sessions fetch.
// Archived sessions never show on the main screen and can't be opened.
let archived = JSON.parse(localStorage.getItem('archived') || '{}')
// Migrate the old flat "hidden" set into archives (metadata unknown).
try {
  const old = JSON.parse(localStorage.getItem('hidden') || '[]')
  if (old.length) {
    for (const id of old) if (!archived[id]) archived[id] = { title: null, proj: null, ts: null }
    localStorage.removeItem('hidden')
    localStorage.setItem('archived', JSON.stringify(archived))
  }
} catch { /* ignore */ }
// Custom titles: id -> title. even-terminal has no rename API (titles come
// from the session file), so renames live here and shadow the fetched title.
let titleMap = JSON.parse(localStorage.getItem('titles') || '{}')

// Overrides are persisted on the companion (~/.even-terminal/) so every
// device sees the same archives/titles. localStorage is kept as a cache for
// when the companion state hasn't loaded yet (or the fetch fails).
function cacheOverrides() {
  localStorage.setItem('done', JSON.stringify(doneMap))
  localStorage.setItem('archived', JSON.stringify(archived))
  localStorage.setItem('titles', JSON.stringify(titleMap))
}
let pushing = 0   // PUTs in flight — pause adoption so a poll can't revert them
function saveOverrides() {
  cacheOverrides()
  pushing++
  fetch('/companion/overrides', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: doneMap, archived, titles: titleMap }),
  }).catch(() => { /* offline — the local cache still has it */ })
    .finally(() => pushing--)
}
async function loadOverrides() {
  if (pushing) return
  try {
    const r = await fetch('/companion/overrides')
    if (!r.ok) return
    const srv = await r.json()
    if (!localStorage.getItem('overridesSynced')) {
      // First contact from this device: merge its local data into the shared
      // state (server wins on conflicts) and upload the result.
      doneMap = { ...doneMap, ...(srv.done || {}) }
      archived = { ...archived, ...(srv.archived || {}) }
      titleMap = { ...titleMap, ...(srv.titles || {}) }
      localStorage.setItem('overridesSynced', '1')
      saveOverrides()
    } else {
      // Afterwards the server is the source of truth, so unarchives and
      // title resets made on another device propagate here too.
      doneMap = srv.done || {}
      archived = srv.archived || {}
      titleMap = srv.titles || {}
      cacheOverrides()
    }
  } catch { /* companion unreachable — keep the cached copy */ }
}
function dispTitle(s) {
  return titleMap[s.id] || s.title || s.id.slice(0, 8)
}
// The header title is only read when a session opens; a new session gets its
// title (first prompt, then Claude's summary) as turns land, so refetch it.
async function refreshTitle() {
  const id = current
  try {
    const r = await fetch(`/api/sessions?provider=claude&limit=20&_inst=${curPort}`).then((x) => x.json())
    const s = (r.sessions || []).find((x) => x.id === id)
    if (s && view === 'session' && current === id) setTitle(dispTitle(s))
  } catch { /* keep the current title */ }
}
// Prompt-based rename shared by the row menu and the session header.
// Empty input (or the original title) clears the override. Returns the new
// display title, or null if the user cancelled.
function renameSession(id, origTitle, currentShown) {
  const t = prompt('Session title', currentShown || '')
  if (t === null) return null
  const v = t.trim()
  if (!v || v === (origTitle || '')) delete titleMap[id]
  else titleMap[id] = v
  saveOverrides()
  return titleMap[id] || origTitle || id.slice(0, 8)
}
function effStatus(s) {
  return (s.status === 'busy' && doneMap[s.id] === s.timestamp) ? 'idle' : s.status
}
let view = null              // 'list' | 'session' | 'archived'
let current = null           // open sessionId (null = list view)
let es = null                // EventSource
let curAssistant = null      // assistant bubble currently streaming
let turnHadText = false
let pendingCwd = null        // cwd of a new session awaiting its id

// ---------- header / navigation ----------
const APP_TITLE = 'Even Terminal — text input'
// Header title and browser-tab title move together: the session title in
// session view, the app name elsewhere.
function setTitle(t) {
  $('hTitle').textContent = t
  document.title = t
}
function showList() {
  view = 'list'
  current = null
  if (es) { es.close(); es = null }
  $('transcript').style.display = 'none'
  $('sessionList').style.display = ''
  $('composer').style.display = 'none'
  $('backBtn').style.display = 'none'
  $('scrollBtn').style.display = 'none'
  $('stopBtn').style.display = 'none'
  $('statusChip').style.display = 'none'
  $('newBtn').style.display = ''
  setPromptBar('')
  setTitle(APP_TITLE)
  $('hTitle').removeAttribute('title')
  $('hSub').style.display = 'none'
  $('instSel').style.display = ''
  $('instSel').value = scope
  $('modelSel').style.display = 'none'
  $('effortSel').style.display = 'none'
  $('main').scrollTop = 0     // coming back from a session: land at the top
  setHash(`#/${scope}`)
  startPolling()
  loadSessions()
}

function showSession(id, title) {
  view = 'session'
  stopPolling()
  current = id                       // null for a session not created yet
  $('sessionList').style.display = 'none'
  $('transcript').style.display = ''
  $('transcript').innerHTML = ''
  $('composer').style.display = 'flex'
  $('backBtn').style.display = ''
  $('scrollBtn').style.display = ''
  $('stopBtn').style.display = ''
  $('statusChip').style.display = ''
  $('newBtn').style.display = 'none'
  setPromptBar('')
  setTitle(title || 'New session')
  $('hTitle').title = 'Tap to rename'
  $('instSel').style.display = 'none'
  $('modelSel').style.display = ''
  $('effortSel').style.display = ''
  $('hSub').style.display = ''
  setSub()
  setChip('idle')
  curAssistant = null
  thinkingEl = null   // transcript was cleared with innerHTML above
  stick = true        // always land at the bottom when joining a session
  updateScrollBtn()
  if (id) {
    setHash(`#/${curPort}/${id}${title ? '/' + slug(title) : ''}`)
    attach(id)
  }
  $('input').focus()
}

// Session subtitle: project · short id · port (a new session shows the
// directory it will start in).
function setSub() {
  const inst = currentInst()
  const proj = !current && pendingCwd ? shortPath(pendingCwd).split('/').pop() : inst ? projName(inst) : ''
  $('hSub').innerHTML = [proj && `<span class="proj">${esc(proj)}</span>`,
    current && esc(current.slice(0, 8)), inst && `:${inst.port}`].filter(Boolean).join(' · ')
}

// ---------- liveness ----------
// "busy" alone can't tell a turn that advances from one that's wedged, so
// the chip also shows how long the turn has been running, how many output
// tokens it produced (climbing = progress), and flags silence: even-terminal
// beats a running_stats every 10s while a turn runs, so 30s without any
// event means the stream is lost or the instance is stuck.
const HEARTBEAT_MS = 30_000
// In the list, the only signal is the transcript's last write (session
// timestamp). A busy session that hasn't written for 2min is either wedged
// or inside a very long tool call — worth a look either way.
const STALE_MS = 120_000
let chipState = 'idle'
let turnStart = 0        // when the running turn started (corrected by running_stats)
let lastEvent = 0        // last SSE event of any kind
let lastTokens = null    // output tokens so far this turn (from running_stats)

function setChip(state) {
  const c = $('statusChip')
  if (state === 'busy' && chipState !== 'busy') {
    turnStart = Date.now(); lastEvent = Date.now(); lastTokens = null
  }
  chipState = state
  c.textContent = state
  c.className = 'chip ' + state
  if (state === 'busy') tickChip()
}

function fmtAge(ms) {
  const s = Math.max(0, Math.floor(ms / 1000))
  if (s < 60) return s + 's'
  if (s < 3600) return Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0')
  return Math.floor(s / 3600) + 'h' + String(Math.floor((s % 3600) / 60)).padStart(2, '0')
}
const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n)

function tickChip() {
  if (view !== 'session' || chipState !== 'busy') return
  const c = $('statusChip')
  const silent = Date.now() - lastEvent
  let txt = 'busy · ' + fmtAge(Date.now() - turnStart)
  if (silent > HEARTBEAT_MS) txt += ' · ⚠ silent ' + fmtAge(silent)
  else if (lastTokens != null) txt += ' · ↑' + fmtTok(lastTokens)
  c.textContent = txt
  c.className = 'chip busy' + (silent > HEARTBEAT_MS ? ' stale' : '')
}

// List rows: busy sessions carry the transcript's last write on their age
// span (data-act) and status chip (data-live); one shared 1s ticker keeps
// them counting between polls.
function tickAges() {
  const now = Date.now()
  for (const el of document.querySelectorAll('[data-act]')) {
    const age = now - Number(el.dataset.act)
    el.textContent = 'active ' + fmtAge(age) + ' ago'
    el.className = 'w ' + (age < 30_000 ? 'fresh' : age < STALE_MS ? 'quiet' : 'stale')
  }
  for (const el of document.querySelectorAll('[data-live]')) {
    const stale = now - Number(el.dataset.live) > STALE_MS
    el.classList.toggle('stale', stale)
    el.textContent = stale ? 'stalled?' : 'busy'
  }
  tickChip()
}
setInterval(tickAges, 1000)

// ---------- instances ----------
// Active instance = the open session's port in session view, else the scope
// filter (null when scope is 'all').
function currentInst() {
  const p = view === 'session' ? curPort : (scope === 'all' ? null : Number(scope))
  return instances.find((i) => i.port === p) || null
}
function projName(inst) {
  return (shortPath(inst.cwd).split('/').pop() || inst.cwd || '?')
}

async function loadInstances() {
  try {
    instances = await fetch('/companion/instances').then((r) => r.json())
  } catch { instances = [] }
  // Keep scope valid: fall back to 'all' if the filtered instance vanished.
  if (scope !== 'all' && !instances.find((i) => i.port === Number(scope))) scope = 'all'
  const sel = $('instSel')
  sel.innerHTML = ''
  if (!instances.length) {
    sel.appendChild(new Option('⚠ even-terminal is not running', ''))
    return
  }
  sel.appendChild(new Option('🌐 All projects ▾', 'all'))
  for (const i of instances) {
    sel.appendChild(new Option(`${projName(i)} · :${i.port} ▾`, String(i.port)))
  }
  sel.value = scope
}

$('instSel').onchange = () => {
  scope = $('instSel').value || 'all'
  localStorage.setItem('scope', scope)
  showList()
}

// Model choice takes effect on the next message (even-terminal applies it to
// the session's next run). Requires the patched even-terminal; an unpatched
// one simply ignores the field.
$('modelSel').value = model
if ($('modelSel').value !== model) { model = ''; $('modelSel').value = '' }   // stale stored id
$('modelSel').onchange = () => {
  model = $('modelSel').value
  localStorage.setItem('model', model)
}
$('effortSel').value = effort
if ($('effortSel').value !== effort) { effort = ''; $('effortSel').value = '' }
$('effortSel').onchange = () => {
  effort = $('effortSel').value
  localStorage.setItem('effort', effort)
}

// Poll the global view so the pill bar stays live while browsing the list.
function startPolling() {
  stopPolling()
  pollTimer = setInterval(() => {
    if (view === 'list' && document.visibilityState === 'visible') loadOverrides().then(loadSessions)
  }, 5000)
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
}

// Returning to a backgrounded tab: pull the shared state right away so
// archives/renames made on another device show up without a manual ↻.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return
  loadOverrides().then(() => {
    if (view === 'list') loadSessions()
    else if (view === 'archived') renderArchived()
    else if (view === 'session' && current && titleMap[current]) setTitle(titleMap[current])
  })
})

// ---------- session list ----------
// Fetch every instance's sessions in parallel and tag each with its port /
// project, so both the global bar and the (optionally filtered) list can be
// built from one aggregated set.
async function loadSessions() {
  const box = $('sessionList')
  const firstPaint = !allSessions.length
  if (firstPaint) box.innerHTML = '<div class="empty">loading…</div>'
  if (!instances.length) { box.innerHTML = '<div class="empty">⚠ even-terminal is not running.</div>'; return }
  const per = await Promise.all(instances.map(async (inst) => {
    try {
      const r = await fetch(`/api/sessions?provider=claude&limit=20&_inst=${inst.port}`).then((x) => x.json())
      if (r.error) throw new Error(r.error)
      return (r.sessions || []).map((s) => ({ ...s, _port: inst.port, _proj: projName(inst) }))
    } catch { return [] }
  }))
  allSessions = per.flat().sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0))
  if (view === 'list') renderList()
}

function busySessions(port) {
  return allSessions.filter((s) =>
    (port == null || s._port === port) && !archived[s.id] && effStatus(s) === 'busy')
}
const lastWrite = (s) => new Date(s.timestamp || 0).getTime()
function busyCount(port) { return busySessions(port).length }
function stalledCount(port) {
  const now = Date.now()
  return busySessions(port).filter((s) => now - lastWrite(s) > STALE_MS).length
}

function renderList() {
  const box = $('sessionList')
  box.innerHTML = ''

  // Global bar: one pill per instance (+ an "All" pill), showing running
  // counts and doubling as the scope filter.
  const bar = document.createElement('div')
  bar.className = 'gbar'
  const mkPill = (label, key, port) => {
    const busy = busyCount(port), stalled = stalledCount(port)
    const p = document.createElement('button')
    p.className = 'gpill' + (String(scope) === String(key) ? ' active' : '') +
      (busy ? ' busy' : '') + (stalled ? ' stale' : '')
    p.innerHTML = `<span class="dot"></span>${esc(label)}` + (busy ? `<span class="n">${busy}</span>` : '')
    if (stalled) p.title = `${stalled} busy session(s) with no transcript write for 2min+`
    p.onclick = () => { scope = String(key); localStorage.setItem('scope', scope); $('instSel').value = scope; showList() }
    return p
  }
  bar.appendChild(mkPill('All', 'all', null))
  for (const i of instances) bar.appendChild(mkPill(projName(i), i.port, i.port))
  box.appendChild(bar)

  const scoped = scope === 'all' ? allSessions : allSessions.filter((s) => s._port === Number(scope))
  const rows = scoped.filter((s) => !archived[s.id])
  if (!rows.length) {
    box.insertAdjacentHTML('beforeend', '<div class="empty">No Claude Code sessions found.</div>')
  }
  for (const s of rows) {
    const st = effStatus(s)
    const row = document.createElement('div')
    row.className = 'row'
    const when = s.timestamp ? relTime(new Date(s.timestamp)) : ''
    row.innerHTML =
      `<div class="meta"><div class="t"></div>` +
      `<div class="d"><span class="proj">${esc(s._proj)}</span> · <span class="w"></span></div>` +
      (st === 'busy' ? `<div class="pre">…</div>` : '') +
      `</div>` +
      (st ? `<span class="chip ${esc(st)}">${esc(st)}</span>` : '') +
      `<button class="kebab" title="Actions">⋯</button>`
    row.querySelector('.t').textContent = dispTitle(s)
    row.querySelector('.w').textContent = when
    if (st === 'busy') {
      // live age + stall detection, driven by tickAges()
      row.querySelector('.w').dataset.act = lastWrite(s)
      row.querySelector('.chip').dataset.live = lastWrite(s)
      row.querySelector('.w').title = 'time since the transcript was last written'
      fillLastLine(s, row.querySelector('.pre'))
    }
    row.onclick = () => { curPort = s._port; showSession(s.id, dispTitle(s)) }
    row.querySelector('.kebab').onclick = (e) => { e.stopPropagation(); rowMenu(e.currentTarget, s) }
    box.appendChild(row)
  }

  // Footer: enter the Archives view.
  const nArch = Object.keys(archived).length
  if (nArch) {
    const f = document.createElement('div')
    f.className = 'footer'
    f.textContent = `🗄 Archived (${nArch})`
    f.onclick = showArchived
    box.appendChild(f)
  }
  tickAges()   // paint the live ages now rather than on the next tick
}

// Archives view: archived conversations across all instances, read-only
// except for unarchiving. Rendered from the stored snapshot so it works even
// after a session drops out of the recent-sessions fetch.
function showArchived() {
  view = 'archived'
  current = null
  if (es) { es.close(); es = null }
  stopPolling()
  $('transcript').style.display = 'none'
  $('sessionList').style.display = ''
  $('composer').style.display = 'none'
  $('backBtn').style.display = ''
  $('scrollBtn').style.display = 'none'
  $('stopBtn').style.display = 'none'
  $('statusChip').style.display = 'none'
  $('newBtn').style.display = 'none'
  $('instSel').style.display = 'none'
  $('modelSel').style.display = 'none'
  $('effortSel').style.display = 'none'
  $('hSub').style.display = 'none'
  setPromptBar('')
  setTitle('Archives')
  $('hTitle').removeAttribute('title')
  setHash('#/archived')
  renderArchived()
}

function renderArchived() {
  const box = $('sessionList')
  box.innerHTML = ''
  const items = Object.entries(archived)
    .map(([id, m]) => ({ id, ...m }))
    .sort((a, b) => new Date(b.ts || 0) - new Date(a.ts || 0))
  if (!items.length) {
    box.innerHTML = '<div class="empty">No archived conversations.</div>'
    return
  }
  for (const it of items) {
    const row = document.createElement('div')
    row.className = 'row muted'
    const when = it.ts ? relTime(new Date(it.ts)) : ''
    row.innerHTML =
      `<div class="meta"><div class="t"></div>` +
      `<div class="d">${it.proj ? `<span class="proj">${esc(it.proj)}</span> · ` : ''}${esc(when)}</div></div>` +
      `<button class="unarch" title="Restore to the main list">Unarchive</button>`
    row.querySelector('.t').textContent = it.title || it.id.slice(0, 8)
    row.querySelector('.unarch').onclick = () => { delete archived[it.id]; saveOverrides(); renderArchived() }
    box.appendChild(row)
  }
}

// Anchored action menu (row ⋯ and header ⋯). items: [label, fn, {swatch, on}?],
// '-' for a divider, or { label } for a section heading.
function popMenu(anchor, items) {
  document.querySelector('.menu')?.remove()
  const m = document.createElement('div')
  m.className = 'menu'
  for (const it of items) {
    if (it === '-') { m.appendChild(document.createElement('hr')); continue }
    if (!Array.isArray(it)) {
      const h = document.createElement('div')
      h.className = 'lbl'
      h.textContent = it.label
      m.appendChild(h)
      continue
    }
    const [label, fn, opt = {}] = it
    const b = document.createElement('button')
    b.textContent = label
    if (opt.swatch) {
      const sw = document.createElement('span')
      sw.className = 'sw'
      sw.style.background = opt.swatch
      b.prepend(sw)
    }
    if (opt.on) b.classList.add('on')
    b.onclick = (e) => { e.stopPropagation(); m.remove(); fn() }
    m.appendChild(b)
  }
  const r = anchor.getBoundingClientRect()
  m.style.top = `${r.bottom + 4}px`
  m.style.right = `${window.innerWidth - r.right}px`
  document.body.appendChild(m)
  setTimeout(() => document.addEventListener('click', () => m.remove(), { once: true }), 0)
}
// Per-row actions: mark a mislabeled session done, rename, archive, restart.
function rowMenu(anchor, s) {
  const items = []
  if (s.status === 'busy' && effStatus(s) === 'busy') {
    items.push(['✓ Mark done', () => { doneMap[s.id] = s.timestamp; saveOverrides(); renderList() }])
  }
  items.push(
    ['✏️ Rename', () => { if (renameSession(s.id, s.title, dispTitle(s)) !== null) renderList() }],
    ['🗄 Archive', () => {
      archived[s.id] = { title: titleMap[s.id] || s.title || null, proj: s._proj || null, ts: s.timestamp || null }
      saveOverrides(); renderList()
    }],
    ['🔄 Restart even-terminal', () => doRestart(s._port)],
  )
  popMenu(anchor, items)
}

// Preview the latest line of a busy session, from its on-disk history (cheap,
// works for any instance). Cached by lastModified so the poll only refetches
// sessions that actually advanced.
const lineCache = new Map()
async function fillLastLine(s, el) {
  const hit = lineCache.get(s.id)
  if (hit && hit.ts === s.timestamp) { el.textContent = hit.text || '…'; return }
  try {
    const r = await fetch(`/api/sessions/${s.id}/history?provider=claude&limit=2&_inst=${s._port}`).then((x) => x.json())
    const last = (r.history || []).filter((h) => h.text && h.text.trim()).pop()
    let text = last ? last.text.trim().split('\n').map((l) => l.trim()).filter(Boolean).pop() : ''
    if (last && last.role === 'user') text = '› ' + text
    text = text.slice(0, 120)
    lineCache.set(s.id, { ts: s.timestamp, text })
    if (el.isConnected) el.textContent = text || '…'
  } catch { /* keep the placeholder */ }
}

// When the message happened, shown on every transcript line (data-when +
// CSS ::after) with the full date in the hover tooltip. ts comes from the
// patched even-terminal (epoch ms stamped on each SSE event, ISO string on
// history entries); unpatched instances send none and nothing is shown.
function stamp(el, ts) {
  if (ts != null) {
    const d = new Date(ts)
    if (!isNaN(d)) {
      el.title = d.toLocaleString()
      el.dataset.when = d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString() : d.toLocaleString()
    }
  }
  return el
}
function relTime(d) {
  const s = Math.floor((Date.now() - d.getTime()) / 1000)
  if (s < 60) return 'just now'
  if (s < 3600) return Math.floor(s / 60) + 'm ago'
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'
  return Math.floor(s / 86400) + 'd ago'
}
function shortPath(p) { return (p || '').replace(/^\/Users\/[^/]+/, '~') }
function esc(t) {
  return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

// ---------- markdown ----------
// Minimal dependency-free renderer: enough of GFM for agent replies
// (headings, nested lists, fenced code, tables, quotes, links, bold /
// italic / strike / inline code). Everything goes through esc() first, so
// no raw model output ever reaches innerHTML. ```mermaid fences render as
// diagrams once closed — see the mermaid section below.
function mdInline(s) {
  const codes = []
  s = String(s).replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = esc(s)
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  s = s.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  s = s.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>')
  s = s.replace(/\*(\S(?:[^*\n]*\S)?)\*/g, '<em>$1</em>')
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`)
}

// items: [{ind, ord, text}] — nesting is driven by leading-space depth.
function mdList(items) {
  if (!items.length) return ''
  const base = items[0].ind
  let out = items[0].ord ? '<ol>' : '<ul>'
  let k = 0
  while (k < items.length) {
    const it = items[k++]
    const kids = []
    while (k < items.length && items[k].ind > base) kids.push(items[k++])
    out += `<li>${mdInline(it.text)}${mdList(kids)}</li>`
  }
  return out + (items[0].ord ? '</ol>' : '</ul>')
}

function mdRender(src) {
  const lines = String(src ?? '').split('\n')
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/
  let html = ''
  let para = []
  let i = 0
  const flush = () => {
    if (para.length) { html += `<p>${para.map(mdInline).join('<br>')}</p>`; para = [] }
  }
  while (i < lines.length) {
    const l = lines[i]
    const fence = l.match(/^```(\S*)/)
    if (fence) {                                   // fenced code (maybe still streaming)
      flush()
      const buf = []
      let closed = false
      i++
      while (i < lines.length) {
        if (/^```\s*$/.test(lines[i])) { closed = true; i++; break }
        buf.push(lines[i++])
      }
      const code = buf.join('\n')
      if (fence[1].toLowerCase() === 'mermaid' && closed) {
        html += `<div class="mermaid-box" data-mmd="${esc(code)}"><pre><code>${esc(code)}</code></pre></div>`
      } else {
        html += `<pre><code>${esc(code)}</code></pre>`
      }
      continue
    }
    if (/^\s*$/.test(l)) { flush(); i++; continue }
    const h = l.match(/^(#{1,6})\s+(.*)$/)
    if (h) { flush(); html += `<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`; i++; continue }
    if (/^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); html += '<hr>'; i++; continue }
    if (/^\s*>/.test(l)) {                         // blockquote (recursive)
      flush()
      const q = []
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${mdRender(q.join('\n'))}</blockquote>`
      continue
    }
    if (LI.test(l)) {
      flush()
      const items = []
      let m
      while (i < lines.length && (m = lines[i].match(LI))) {
        items.push({ ind: m[1].length, ord: /\d/.test(m[2]), text: m[3] })
        i++
      }
      html += mdList(items)
      continue
    }
    const sep = lines[i + 1]
    if (l.includes('|') && sep && /^[|\s:-]+$/.test(sep) && sep.includes('-') && sep.includes('|')) {
      flush()
      const row = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim())
      const cells = (r, tag) => r.map((c) => `<${tag}>${mdInline(c)}</${tag}>`).join('')
      html += `<table><thead><tr>${cells(row(l), 'th')}</tr></thead><tbody>`
      i += 2
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        html += `<tr>${cells(row(lines[i++]), 'td')}</tr>`
      }
      html += '</tbody></table>'
      continue
    }
    para.push(l)
    i++
  }
  flush()
  return html
}

// ---------- mermaid ----------
// Loaded from the CDN only when a diagram actually shows up; offline (or on
// an invalid diagram) the fenced code block simply stays visible.
let mermaidP = null
function loadMermaid() {
  if (!mermaidP) {
    mermaidP = new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js'
      s.onload = () => {
        window.mermaid.initialize(mermaidConfig())
        resolve(window.mermaid)
      }
      s.onerror = () => reject(new Error('mermaid load failed'))
      document.head.appendChild(s)
    })
  }
  return mermaidP
}

// Diagrams take the current theme's tokens ('base' theme needs hex colors,
// which every token used here is).
function mermaidConfig() {
  return {
    startOnLoad: false, securityLevel: 'strict', theme: 'base',
    themeVariables: {
      darkMode: getComputedStyle(document.documentElement).colorScheme === 'dark',
      background: cssVar('--bg'), mainBkg: cssVar('--surface-2'), primaryColor: cssVar('--surface-2'),
      primaryTextColor: cssVar('--fg'), primaryBorderColor: cssVar('--accent'), textColor: cssVar('--fg'),
      secondaryColor: cssVar('--surface'), tertiaryColor: cssVar('--surface'), lineColor: cssVar('--dim'),
      clusterBkg: cssVar('--surface'), clusterBorder: cssVar('--border'), edgeLabelBackground: cssVar('--surface'),
      fontFamily: getComputedStyle(document.body).fontFamily,
    },
  }
}

// svg cache keyed by diagram source: streaming re-renders reset innerHTML on
// every delta, so already-rendered diagrams must come back instantly (and a
// null entry pins a diagram that failed, so we never retry in a loop).
const mmdCache = new Map()
const mmdPending = new Set()
let mmdSeq = 0
function applyMermaidCache() {
  for (const box of document.querySelectorAll('.mermaid-box:not(.rendered)')) {
    const svg = mmdCache.get(box.dataset.mmd)
    if (svg) { box.innerHTML = svg; box.classList.add('rendered') }
  }
}
async function renderMermaid(root) {
  applyMermaidCache()
  for (const box of root.querySelectorAll('.mermaid-box:not(.rendered)')) {
    const code = box.dataset.mmd
    if (mmdCache.has(code) || mmdPending.has(code)) continue
    mmdPending.add(code)
    const id = 'mmd' + (++mmdSeq)
    try {
      const mermaid = await loadMermaid()
      const { svg } = await mermaid.render(id, code)
      mmdCache.set(code, svg)
    } catch {
      mmdCache.set(code, null)
      document.getElementById('d' + id)?.remove()   // mermaid can leave its scratch node behind
    }
    mmdPending.delete(code)
    applyMermaidCache()
    scrollDown()
  }
}

// ---------- routing ----------
// Speaking URLs: #/<port> (session list) and #/<port>/<sessionId>/<title-slug>
// so a refresh (or a shared link) lands back on the same view.
function slug(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48)
}
function deslug(s) {
  const t = String(s || '').replace(/-/g, ' ').trim()
  return t ? t[0].toUpperCase() + t.slice(1) : ''
}
function setHash(h) {
  if (location.hash !== h) location.hash = h
}
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean)
  const seg0 = parts[0]
  const id = parts[1] || null
  if (seg0 === 'archived') {
    if (view !== 'archived') showArchived()
    return
  }
  if (id) {
    if (archived[id]) { showArchived(); return }   // archived: read-only, no opening
    const p = Number(seg0)
    if (p && instances.find((i) => i.port === p)) curPort = p
    if (current === id) return           // already showing it (e.g. slug added)
    showSession(id, titleMap[id] || (parts[2] ? deslug(parts[2]) : null))
    return
  }
  // list view: seg0 is 'all' or a port
  const wanted = (!seg0 || seg0 === 'all') ? 'all'
    : (instances.find((i) => i.port === Number(seg0)) ? String(Number(seg0)) : 'all')
  if (view === 'list' && wanted === scope) return
  scope = wanted
  localStorage.setItem('scope', scope)
  showList()
}
window.addEventListener('hashchange', route)

// ---------- transcript ----------
// Stick-to-bottom: on when a session opens, off as soon as the user scrolls
// up, back on when they return to the bottom. The ⇣ header button mirrors
// this state; tapping it jumps to the bottom and re-engages following.
let stick = true
function updateScrollBtn() {
  $('scrollBtn').classList.toggle('on', stick)
}
$('main').addEventListener('scroll', () => {
  const m = $('main')
  stick = m.scrollHeight - m.scrollTop - m.clientHeight < 60
  if (view === 'session') updateScrollBtn()
})
$('scrollBtn').onclick = () => {
  stick = true
  $('main').scrollTop = $('main').scrollHeight
  updateScrollBtn()
}
function scrollDown() {
  if (stick) $('main').scrollTop = $('main').scrollHeight
}
function setPromptBar(text) {
  $('promptBar').querySelector('span').textContent = text || ''
  $('promptBar').classList.remove('open')
  $('promptBar').style.display = text && view === 'session' ? '' : 'none'
}
$('promptBar').onclick = () => $('promptBar').classList.toggle('open')
function addEl(el) { $('transcript').appendChild(el); scrollDown(); return el }
function bubble(cls, text) {
  const b = document.createElement('div')
  b.className = 'bubble ' + cls
  b.textContent = text
  if (/^user\b/.test(cls)) setPromptBar(text)
  return addEl(b)
}
// Assistant bubble rendered as markdown. _raw keeps the source so streaming
// can append and re-render (renderMd) on every delta.
function mdBubble(cls, raw) {
  const b = document.createElement('div')
  b.className = 'bubble md ' + cls
  b._raw = String(raw ?? '')
  addEl(b)
  renderMd(b)
  return b
}
function renderMd(el) {
  el.innerHTML = mdRender(el._raw)
  renderMermaid(el)
  scrollDown()
}
function infoLine(text, cls) {
  const l = document.createElement('div')
  l.className = 'line' + (cls ? ' ' + cls : '')
  l.textContent = text
  return addEl(l)
}

async function attach(id) {
  // Session not alive inside even-terminal → show the on-disk history
  try {
    await api('/api/status?provider=claude&sessionId=' + id)
  } catch {
    try {
      const { history } = await api(`/api/sessions/${id}/history?provider=claude&limit=10`)
      for (const h of history || []) {
        if (h.role === 'user') stamp(bubble('user dim', h.text), h.ts)
        else stamp(mdBubble('assistant dim', h.text), h.ts)
      }
      if (history && history.length) infoLine('— history · your next message resumes this session —')
    } catch { /* no history available */ }
  }
  openStream(id)
}

function openStream(id) {
  if (es) es.close()
  es = new EventSource(withInst(`/api/events?sessionId=${id}&needReplay=true`))
  es.onmessage = (e) => { try { handle(JSON.parse(e.data)) } catch {} }
  es.onerror = () => infoLine('stream connection lost — tap ↻ to reconnect', 'err')
}

const toolEls = new Map()
const permCards = []

// Transient "thinking…" indicator: even-terminal only signals think_start /
// think_end status events (it never streams thinking content), so all we can
// show is that Claude is reasoning.
let thinkingEl = null
function showThinking() {
  if (thinkingEl) return
  thinkingEl = document.createElement('div')
  thinkingEl.className = 'line thinking'
  thinkingEl.textContent = '🧠 thinking…'
  addEl(thinkingEl)
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null }
}

function handle(m) {
  lastEvent = Date.now()
  // The replay on connect resends the whole ring buffer, so anything older
  // than a beat or two is history, not the current turn.
  const fresh = m.ts == null || Date.now() - m.ts < 15_000
  switch (m.type) {
    case 'user_prompt':
      curAssistant = null; turnHadText = false
      if (fresh) { turnStart = m.ts || Date.now(); lastTokens = null }
      stamp(bubble('user', m.text), m.ts)
      break
    case 'text_delta':
      hideThinking()
      if (!curAssistant) curAssistant = mdBubble('assistant', '')
      curAssistant._raw += m.text
      stamp(curAssistant, m.ts)   // last delta wins: hovering shows when the reply finished
      renderMd(curAssistant)
      turnHadText = true
      break
    case 'tool_start': {
      hideThinking()
      curAssistant = null
      const t = document.createElement('div')
      t.className = 'tool'
      t.innerHTML = `<span class="spin"></span>`
      t.firstChild.textContent = '🔧 ' + m.name
      toolEls.set(m.toolId, t)
      addEl(stamp(t, m.ts))
      break
    }
    case 'tool_end': {
      const t = toolEls.get(m.toolId) || addEl(Object.assign(document.createElement('div'), { className: 'tool' }))
      toolEls.delete(m.toolId)
      stamp(t, m.ts)
      t.textContent = '✓ ' + (m.summary || m.name)
      const pre = document.createElement('pre')
      pre.textContent = JSON.stringify(m.detail?.input ?? {}, null, 1).slice(0, 2000) +
        '\n---\n' + String(m.detail?.output ?? '').slice(0, 2000)
      t.appendChild(pre)
      t.onclick = () => t.classList.toggle('open')
      scrollDown()
      break
    }
    case 'permission_request': permissionCard(m); break
    case 'permission_result':
      finishCards()
      stamp(infoLine(`${m.decision === 'denied' ? '✗ denied' : '✓ allowed'} — ${m.summary || m.toolName}`), m.ts)
      break
    case 'user_question': questionCard(m); break
    case 'question_answer':
      finishCards()
      stamp(infoLine('answer sent: ' + Object.values(m.answers || {}).join(' · ')), m.ts)
      break
    case 'status':
      if (m.state === 'think_start') showThinking()
      else if (m.state === 'think_end') hideThinking()
      else if (['busy', 'idle', 'waiting'].includes(m.state)) {
        if (m.state === 'idle') hideThinking()
        setChip(m.state)
      }
      break
    case 'result': {
      hideThinking()
      curAssistant = null
      if (!turnHadText && m.text) stamp(mdBubble('assistant', m.text), m.ts)
      const r = document.createElement('div')
      r.className = 'result'
      r.textContent = `${m.success ? '✓' : '✗'} ${m.turns} turn(s) · ${(m.durationMs / 1000).toFixed(0)}s · $${(m.costUsd ?? 0).toFixed(3)}`
      addEl(stamp(r, m.ts))
      setChip('idle')
      // first reply of a brand-new session: grab its id
      if (!current && m.sessionId) {
        current = m.sessionId
        setSub()
        // replaceState: update the URL without retriggering route()
        history.replaceState(null, '', `#/${curPort}/${current}`)
      }
      if (current) refreshTitle()
      break
    }
    case 'error': stamp(infoLine('error: ' + m.message, 'err'), m.ts); break
    case 'notification': stamp(infoLine(m.text || m.message || ''), m.ts); break
    case 'task_progress': stamp(infoLine(m.text || m.message || m.status || 'working…'), m.ts); break
    case 'running_stats':
      // 10s heartbeat while a turn runs: feeds the chip's elapsed/tokens
      // rather than the transcript.
      if (!fresh) break
      if (chipState !== 'busy') setChip('busy')   // beats only happen mid-turn
      if (typeof m.durationMs === 'number') turnStart = Date.now() - m.durationMs
      if (typeof m.outputTokens === 'number') lastTokens = m.outputTokens
      tickChip()
      break
  }
}

function finishCards() {
  for (const c of permCards.splice(0)) {
    c.classList.add('done')
    c.querySelectorAll('button').forEach((b) => (b.disabled = true))
  }
}

function permissionCard(m) {
  const card = document.createElement('div')
  card.className = 'card'
  card.innerHTML = `<h4>Permission — ${esc(m.toolName)}</h4><p>${esc(m.description || '')}${m.detail ? '\n' + esc(m.detail) : ''}</p><div class="opts"></div>`
  const opts = card.querySelector('.opts')
  for (const o of m.options || [{ text: 'Yes', key: 'allow' }, { text: 'No', key: 'deny' }]) {
    const b = document.createElement('button')
    b.textContent = o.text
    if (o.key === 'allow' || o.key === 'allowAlways') b.classList.add('primary')
    b.onclick = () => post('/api/permission-response', { sessionId: current, provider: 'claude', decision: o.key })
      .then(finishCards).catch((e) => infoLine('failed: ' + e.message, 'err'))
    opts.appendChild(b)
  }
  permCards.push(card)
  addEl(stamp(card, m.ts))
}

function questionCard(m) {
  const answers = {}
  const total = (m.questions || []).length
  const card = document.createElement('div')
  card.className = 'card'
  for (const q of m.questions || []) {
    const h = document.createElement('h4'); h.textContent = q.header || 'Question'
    const p = document.createElement('p'); p.textContent = q.question
    const opts = document.createElement('div'); opts.className = 'opts'
    for (const o of q.options || []) {
      const b = document.createElement('button')
      b.innerHTML = `${esc(o.label)}${o.description ? `<small>${esc(o.description)}</small>` : ''}`
      b.onclick = () => {
        answers[q.question || q.header] = o.label
        opts.querySelectorAll('button').forEach((x) => (x.disabled = true))
        b.disabled = false; b.classList.add('primary')
        if (Object.keys(answers).length >= total) {
          post('/api/question-response', { sessionId: current, provider: 'claude', answer: JSON.stringify(answers) })
            .then(finishCards).catch((e) => infoLine('failed: ' + e.message, 'err'))
        }
      }
      opts.appendChild(b)
    }
    card.append(h, p, opts)
  }
  permCards.push(card)
  addEl(stamp(card, m.ts))
}

// ---------- attachments ----------
// Screenshots and zips are uploaded to the companion, which returns an
// absolute path; we reference those paths in the prompt so Claude Code
// reads (or unzips) them itself.
let attachments = []   // { path, thumb, kind: 'image'|'zip', status: 'up'|'done'|'err', name }

const isZip = (file) =>
  /\.zip$/i.test(file.name || '') || /^application\/(zip|x-zip-compressed)$/.test(file.type)

function renderAttachments() {
  const box = $('attachments')
  box.innerHTML = ''
  box.style.display = attachments.length ? 'flex' : 'none'
  attachments.forEach((a, i) => {
    const el = document.createElement('div')
    el.className = 'att' + (a.kind === 'zip' ? ' file' : '') +
      (a.status === 'up' ? ' up' : '') + (a.status === 'err' ? ' err' : '')
    el.innerHTML = a.kind === 'zip'
      ? `<span>🗜</span><span class="fname"></span><button class="x" title="Remove attachment">✕</button>`
      : `<img src="${a.thumb}"><button class="x" title="Remove attachment">✕</button>`
    if (a.kind === 'zip') el.querySelector('.fname').textContent = a.name
    el.querySelector('.x').onclick = () => { attachments.splice(i, 1); renderAttachments() }
    box.appendChild(el)
  })
}

// Upload one image or zip blob/File through the shared attachment flow.
async function addFile(file) {
  if (!file) return
  const zip = isZip(file)
  if (!zip && !file.type.startsWith('image/')) return
  let dataUrl = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file) })
  // Pickers may hand zips over as octet-stream — normalize so the server
  // doesn't have to guess from the mime alone.
  if (zip) dataUrl = dataUrl.replace(/^data:[^;]*;/, 'data:application/zip;')
  const a = { path: null, thumb: zip ? null : dataUrl, kind: zip ? 'zip' : 'image', status: 'up', name: file.name || 'pasted' }
  attachments.push(a)
  renderAttachments()
  try {
    const r = await fetch('/companion/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataUrl, name: a.name }),
    }).then((x) => x.json())
    if (r.error) throw new Error(r.error)
    a.path = r.path; a.status = 'done'
  } catch (err) {
    a.status = 'err'; infoLine('upload failed: ' + err.message, 'err')
  }
  renderAttachments()
}

$('attachBtn').onclick = () => $('fileInput').click()
$('fileInput').onchange = async (e) => {
  for (const file of [...e.target.files]) await addFile(file)
  e.target.value = ''   // allow re-picking the same file
}

// Paste an image straight into the composer (Ctrl/Cmd+V) — only meaningful in
// a session, and only when the clipboard actually carries an image or a file.
$('input').addEventListener('paste', (e) => {
  const items = [...(e.clipboardData?.items || [])]
    .filter((it) => it.kind === 'file' && (it.type.startsWith('image/') || /zip/.test(it.type)))
  if (!items.length) return
  e.preventDefault()          // don't drop the file's junk text into the field
  for (const it of items) { const f = it.getAsFile(); if (f) addFile(f) }
})

// ---------- sending ----------
async function send() {
  const typed = $('input').value.trim()
  const files = attachments.filter((a) => a.status === 'done' && a.path)
  if (!typed && !files.length) return
  if (attachments.some((a) => a.status === 'up')) { infoLine('waiting for upload…'); return }
  let text = typed
  if (files.length) {
    const list = files.map((a) =>
      '- ' + a.path + (a.kind === 'zip' && a.name ? ` (zip archive: ${a.name})` : '')).join('\n')
    const hasZip = files.some((a) => a.kind === 'zip')
    text = (typed ? typed + '\n\n' : `Please look at the attached ${hasZip ? 'file(s)' : 'screenshot(s)'}.\n\n`) +
      (hasZip
        ? 'Attached file(s) — read the images directly; unzip archives into a temp directory to inspect them:\n'
        : 'Attached image file(s) — read them:\n') + list
  }
  $('input').value = ''
  $('input').style.height = 'auto'
  attachments = []
  renderAttachments()
  setChip('busy')
  try {
    const body = { text, provider: 'claude' }
    if (model) body.model = model
    if (effort) body.effort = effort
    if (current) body.sessionId = current
    else if (pendingCwd) body.cwd = pendingCwd
    const r = await post('/api/prompt', body)
    if (!current && r.sessionId) {
      current = r.sessionId
      setSub()
      history.replaceState(null, '', `#/${curPort}/${current}`)
      openStream(current)   // SSE replay will replay user_prompt
    } else if (!es) {
      openStream(current)
    }
  } catch (err) {
    infoLine('failed to send: ' + err.message, 'err')
    setChip('idle')
  }
}

$('sendBtn').onclick = send
$('input').addEventListener('input', function () {
  this.style.height = 'auto'
  this.style.height = Math.min(this.scrollHeight, 130) + 'px'
})
// Desktop: Ctrl+Enter (or Cmd+Enter) submits
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault()
    send()
  }
})
$('backBtn').onclick = showList
// Tap the title of an open session to rename it (local override).
function renameCurrent() {
  if (view !== 'session' || !current) return
  const s = allSessions.find((x) => x.id === current)
  const nt = renameSession(current, s && s.title, $('hTitle').textContent)
  if (nt === null) return
  setTitle(nt)
  history.replaceState(null, '', `#/${curPort}/${current}/${slug(nt)}`)
}
$('hTitle').onclick = renameCurrent
// Archive the open conversation and drop back to the list. Metadata comes
// from the aggregated list when available, else from what the header shows.
function archiveCurrent() {
  if (!current) return
  const s = allSessions.find((x) => x.id === current)
  const inst = currentInst()
  archived[current] = {
    title: titleMap[current] || (s && s.title) || $('hTitle').textContent || null,
    proj: (s && s._proj) || (inst ? projName(inst) : null),
    ts: (s && s.timestamp) || null,
  }
  saveOverrides()
  showList()
}
function refresh() {
  loadInstances()
  if (current) openStream(current)
  else loadOverrides().then(loadSessions)   // pick up changes made on other devices
}
$('newBtn').onclick = () => {
  const inst = (scope !== 'all' && instances.find((i) => i.port === Number(scope))) || instances[0]
  if (!inst) return
  curPort = inst.port
  pendingCwd = prompt(`Project directory? (${projName(inst)} · :${inst.port})`, inst.cwd || '') || null
  if (pendingCwd === null) return
  showSession(null, 'New session')
}
$('stopBtn').onclick = () => current && post('/api/interrupt', { sessionId: current, provider: 'claude' })
  .then(() => infoLine('interrupt requested'))
  .catch((e) => infoLine('failed: ' + e.message, 'err'))

// Last-resort unstick: when an instance is wedged (busy forever, interrupt
// ignored) the companion kills the even-terminal process (and its claude
// subprocesses) and respawns it. Sessions live on disk, so the open one
// resumes with the next message — only the in-flight turn is lost.
let restarting = false
async function doRestart(port) {
  if (restarting || !port) return
  if (!confirm(`Restart even-terminal :${port}?\n\nThe process and its Claude subprocesses are killed and relaunched. Sessions resume from disk with your next message; only the turn in progress is lost.`)) return
  restarting = true
  if (view === 'session' && es) { es.close(); es = null }   // silence the stream-lost error
  const note = view === 'session' ? infoLine(`restarting even-terminal :${port}…`) : null
  try {
    const r = await fetch('/companion/restart-instance', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ port }),
    }).then((x) => x.json())
    if (r.error) throw new Error(r.error)
    note?.remove()
    await loadInstances()
    if (view === 'session') {
      infoLine(`✓ even-terminal restarted — your next message resumes this session`)
      setChip('idle')
      if (current) openStream(current)
    } else if (view === 'list') {
      loadSessions()
    }
  } catch (err) {
    note?.remove()
    if (view === 'session') infoLine('restart failed: ' + err.message, 'err')
    else alert('Restart failed: ' + err.message)
  }
  restarting = false
}

// ---------- themes ----------
// Every color is a CSS token; [data-theme] on <html> picks the set (applied in
// <head> before first paint). sw = the swatch shown in the menu.
const THEMES = [
  { id: 'dark', name: 'Dark', sw: 'linear-gradient(135deg, #0d1117 50%, #4bb7c3 50%)' },
  { id: 'light', name: 'Light', sw: 'linear-gradient(135deg, #ffffff 50%, #0b7f8a 50%)' },
  { id: 'night', name: 'Night blue', sw: 'linear-gradient(135deg, #0a0f1f 50%, #7aa2f7 50%)' },
  { id: 'solarized', name: 'Solarized', sw: 'linear-gradient(135deg, #fdf6e3 50%, #268bd2 50%)' },
  { id: 'mermaid', name: 'Mermaid', sw: 'linear-gradient(135deg, #ff69b4, #e0218a 55%, #b5126f)' },
]
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() }
function setTheme(id) {
  document.documentElement.dataset.theme = id
  try { localStorage.setItem('theme', id) } catch { /* private mode: theme just won't persist */ }
  syncThemeColor()
  // diagrams are baked SVGs: redraw them in the new palette
  if (mermaidP) mermaidP.then((m) => {
    m.initialize(mermaidConfig())
    mmdCache.clear()
    document.querySelectorAll('.mermaid-box.rendered').forEach((b) => b.classList.remove('rendered'))
    renderMermaid(document)
  }).catch(() => {})
}
// mobile browser chrome follows the header color
function syncThemeColor() { document.querySelector('meta[name=theme-color]').content = cssVar('--surface') }
syncThemeColor()

// Header ⋯: the view's secondary actions, then the theme picker.
$('moreBtn').onclick = (e) => {
  e.stopPropagation()
  const items = []
  if (view === 'session') {
    if (current) items.push(['✏️ Rename', renameCurrent], ['🗄 Archive', archiveCurrent])
    items.push(['↻ Reconnect', refresh], ['🔄 Restart even-terminal', () => doRestart(curPort)])
  } else if (view === 'list') {
    items.push(['↻ Refresh', refresh])
  }
  if (items.length) items.push('-')
  items.push({ label: 'Theme' })
  const curTheme = document.documentElement.dataset.theme
  for (const t of THEMES) items.push([t.name, () => setTheme(t.id), { swatch: t.sw, on: curTheme === t.id }])
  popMenu(e.currentTarget, items)
}

// ---------- boot ----------
// Overrides must be in before route(): it decides archived-vs-open by id.
Promise.all([loadInstances(), loadOverrides()]).then(route)
</script>
</body>
</html>
